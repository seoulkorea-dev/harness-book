# PR과 main push마다 검사를 실행한다. 브랜치 보호에서 이 검사를 필수로 지정한다.
# 원고 규칙 검사 도구는 비공개 book-kit에 있어 CI에서는 빌드와 빌드 결과 일치만 본다(D-151). 원고 규칙 검사는 작성 세션의 check_all.
name: book-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 검사(빌드, 그림, 예제, 빌드 결과와 커밋 일치)
        run: python tools/check_all.py --ci
