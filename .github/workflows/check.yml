# PR과 main push마다 빌드와 lint를 실행한다. 실패하면 병합할 수 없게 브랜치 보호에서 필수 검사로 지정한다.
name: book-check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 빌드
        run: python tools/build.py
      - name: 빌드 결과가 커밋과 같은지(빌드하지 않고 push한 경우 실패)
        run: git diff --exit-code -- index.html chapters appendix
      - name: 번호와 링크
        run: python lint/check_numbers.py
      - name: 구조
        run: python lint/check_structure.py
      - name: 문체 경고(경고 줄이 있으면 실패)
        run: |
          python lint/check_style.py | tee style.txt
          ! grep -q '^경고 ' style.txt
      - name: 금칙어
        run: |
          if git grep -nE -f lint/banned.txt -- index.html chapters appendix; then exit 1; fi
