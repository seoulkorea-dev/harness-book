<h1>그림 2-1 시안 두 개(2장 정비, PR #87)</h1>
<p>공통: 흐름 번호 없음(구성형), 가운데 모델의 판단과 응답(하네스 바깥), 지시 묶음(역할, 기록)과 실행 수단 묶음(도구) → 판단의 조건, 판단과 응답 → 강제 묶음(권한, 검증) 판단 결과의 통제(이슈 #66 Neo 05:25, 05:26). 카드는 정할 것, 이유, 주로 작동하는 단계(단계 이름만).</p>
