<h1>에이전트에게 일을 맡기는 관리자의 설계</h1>
<p class="subtitle">프롬프트, 컨텍스트, 하네스로 AI 에이전트 프로젝트 운영하기</p>
<p>이 책은 AI 에이전트에 업무를 맡기는 관리자가 프롬프트, 컨텍스트, 하네스를 설계하고 운영하는 방법을 다룹니다. 이 책은 초안이며, 검수를 거쳐 내용이 수정될 수 있습니다.</p>
<h2 id="goals">이 책의 목표</h2>
<p>이 책은 열 개 장으로 구성했습니다. 장마다 끝까지 읽은 뒤 할 수 있는 일을 목표로 정했습니다. 책의 목적과 읽는 순서는 <a href="chapters/prologue.html#order">시작하며</a>에 있습니다.</p>
